name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  # The tests run under plain Node; the Electron binary is not needed here.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency needs its install scripts here (the Electron binary is skipped anyway).
      - run: npm ci --ignore-scripts
      - run: npm test
