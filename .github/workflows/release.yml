name: Release

# Push a tag like v1.0.0. Every platform is built, its packaged app is launched
# once (smoke test), and the files land in a DRAFT release with checksums. The
# draft is published by hand after a last check.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            app: dist/win-unpacked/Country Profile Pictures.exe
          - os: macos-latest
            args: --mac
            app: dist/mac-arm64/Country Profile Pictures.app/Contents/MacOS/Country Profile Pictures
          - os: ubuntu-latest
            args: --linux
            app: dist/linux-unpacked/country-profile-pics
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # electron-builder downloads Electron itself; no install script is needed.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
      - name: Launch the packaged app once
        run: node scripts/smoke.mjs "${{ matrix.app }}"

      # The files people download, installed and opened the way the user guide says.
      - name: Installer and portable app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Country Profile Pictures"
          Start-Process -Wait -FilePath dist\country-profile-pics-windows-setup.exe -ArgumentList '/S', '/currentuser'
          node scripts/smoke.mjs "$dir\Country Profile Pictures.exe"
          if ($LASTEXITCODE) { exit 1 }
          Start-Process -Wait -FilePath "$dir\Uninstall Country Profile Pictures.exe" -ArgumentList '/S', '/currentuser'
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\Country Profile Pictures.exe") { throw 'The uninstaller left the app behind.' }
          node scripts/smoke.mjs dist\country-profile-pics-windows-portable.exe
          if ($LASTEXITCODE) { exit 1 }
      - name: Apple silicon disk image, copied to Applications (macOS)
        if: runner.os == 'macOS'
        run: scripts/check-dmg.sh dist/country-profile-pics-mac-arm64.dmg arm64
      - name: The .deb, installed, with Chromium's sandbox on (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2> /dev/null || echo n/a)"
          sudo apt-get install -y -qq ./dist/country-profile-pics-linux-x64.deb > /dev/null
          exe=$(dpkg -L country-profile-pics | grep -E '^/opt/.*/country-profile-pics$')
          grep -hE '^(Name|Exec)=' /usr/share/applications/*.desktop | grep -i 'country' || { echo 'No menu entry was installed.'; exit 1; }
          node scripts/smoke.mjs "$exe" --sandbox
          sudo apt-get remove -y -qq country-profile-pics > /dev/null
          ! test -e "$exe"
      - name: The AppImage, and its no-FUSE fallback (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/country-profile-pics-linux-x64.AppImage
          # The guide's way around a missing FUSE 2 (it needs no FUSE at all).
          node scripts/smoke.mjs dist/country-profile-pics-linux-x64.AppImage --appimage-extract-and-run
          sudo apt-get install -y -qq libfuse2t64 > /dev/null
          node scripts/smoke.mjs dist/country-profile-pics-linux-x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  # The Intel disk image, opened on an Intel Mac (Rosetta on the Apple silicon
  # runner is too slow to start it reliably).
  intel-mac:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist-macOS
          path: dist
      - name: Intel disk image, copied to Applications
        run: scripts/check-dmg.sh dist/country-profile-pics-mac-x64.dmg x86_64

  release:
    needs: [build, intel-mac]
    # A manual run on a branch only builds and checks; releases come from tags.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --title "Country Profile Pictures $TAG" --notes-file .github/release-notes.md
          gh release upload "$TAG" artifacts/* --clobber
