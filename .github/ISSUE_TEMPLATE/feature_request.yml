name: An idea
description: Something the app could do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Two things stay out on purpose: a filter by ethnicity, and age ranges that end below 18.
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The job, in your words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How the app could make that easier.
